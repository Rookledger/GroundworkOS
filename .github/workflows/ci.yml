name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      # Runs @workspace/api-server's integration suite inside a real Workers
      # runtime (Miniflare/workerd) against a real local D1 database - see
      # artifacts/api-server/vitest.integration.config.ts. Replaces the
      # old Express version's Postgres service container + schema
      # push/seed steps, which no longer apply now that the backend runs on
      # D1/Workers (see @workspace/db's package.json, which dropped the
      # push-force script this used to call).
      - name: Integration test
        run: pnpm run test:integration

      - name: Build
        run: pnpm run build
        env:
          BASE_PATH: /
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_dummy-key-for-ci-build
