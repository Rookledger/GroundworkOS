name: Deploy (reusable)

# The actual deploy steps for one client's GroundworkOS instance (its API
# Worker + frontend Worker), factored out as a reusable workflow
# (`workflow_call`) so both entry points below share exactly one
# implementation instead of drifting:
#   - deploy.yml            - manual, any client, triggered from the Actions
#                              tab (onboarding a new client, or a deliberate
#                              redeploy/rollback of an existing one).
#   - deploy-auto.yml        - automatic, on every push to `main`, hardcoded
#                              to the "ktr" client only - see that file for
#                              why auto-deploy is scoped to one client rather
#                              than every `env.<slug>` block.
#
# Reads/writes exactly the same GitHub Environment secrets
# (CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, BETTER_AUTH_SECRET) either
# entry point already relies on - see DEPLOYMENT.md's "Multiple clients,
# multiple Cloudflare accounts" section - so onboarding a client for manual
# dispatch is all that's needed for it to also be eligible for auto-deploy
# later, with no separate secret setup.

on:
  workflow_call:
    inputs:
      client:
        description: "Client slug - must match an env.<slug> block in both wrangler.jsonc files and a GitHub Environment of the same name"
        required: true
        type: string
      run_migrations:
        description: "Also apply pending D1 migrations to this client's database"
        required: false
        type: boolean
        default: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.client }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set BETTER_AUTH_SECRET
        # Optional: only runs if this environment has a BETTER_AUTH_SECRET
        # GitHub secret configured. Lets a client be fully onboarded via
        # GitHub Environment secrets alone, with no local `wrangler login`
        # needed. Safe to run on every deploy - `wrangler secret put` just
        # overwrites with the same value when it hasn't changed.
        working-directory: artifacts/api-server
        run: |
          if [ -z "$BETTER_AUTH_SECRET" ]; then
            echo "No BETTER_AUTH_SECRET GitHub secret set for this environment - skipping. Set one locally with 'wrangler secret put BETTER_AUTH_SECRET --env ${{ inputs.client }}', or add a BETTER_AUTH_SECRET environment secret in GitHub to have this step manage it instead."
            exit 0
          fi
          echo "$BETTER_AUTH_SECRET" | pnpm exec wrangler secret put BETTER_AUTH_SECRET --env "${{ inputs.client }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}

      - name: Apply D1 migrations
        if: ${{ inputs.run_migrations }}
        working-directory: artifacts/api-server
        run: pnpm exec wrangler d1 migrations apply groundworkos --env "${{ inputs.client }}" --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy API Worker
        working-directory: artifacts/api-server
        run: pnpm exec wrangler deploy --env "${{ inputs.client }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build frontend
        working-directory: artifacts/groundworkos
        run: pnpm run build
        env:
          BASE_PATH: /

      - name: Deploy frontend Worker
        working-directory: artifacts/groundworkos
        run: pnpm exec wrangler deploy --env "${{ inputs.client }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
