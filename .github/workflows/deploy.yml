name: Deploy

# Manually deploys one client's GroundworkOS instance (its API Worker +
# frontend Worker) to that client's own Cloudflare account. Each client is a
# named Wrangler environment (see artifacts/api-server/wrangler.jsonc and
# artifacts/groundworkos/wrangler.jsonc's `env.<client>` blocks) and a
# matching GitHub Environment of the same name holding that client's
# CLOUDFLARE_API_TOKEN (and CLOUDFLARE_ACCOUNT_ID, if not set inline in
# wrangler.jsonc) as environment secrets - see DEPLOYMENT.md's "Multiple
# clients, multiple Cloudflare accounts" section.
#
# Manual trigger, any client: this is what you run to onboard a new client,
# or to deliberately redeploy/rollback an existing one on demand. It shares
# its actual deploy steps with deploy-auto.yml (which auto-deploys on every
# push to `main`, but only for the "ktr" client) via deploy-reusable.yml -
# see that file's header for why the two are split.

on:
  workflow_dispatch:
    inputs:
      client:
        description: "Client slug - must match an env.<slug> block in both wrangler.jsonc files and a GitHub Environment of the same name"
        required: true
        type: string
      run_migrations:
        description: "Also apply pending D1 migrations to this client's database"
        required: false
        type: boolean
        default: true

jobs:
  deploy:
    uses: ./.github/workflows/deploy-reusable.yml
    with:
      client: ${{ inputs.client }}
      run_migrations: ${{ inputs.run_migrations }}
    secrets: inherit
